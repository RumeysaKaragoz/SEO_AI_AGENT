<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SEO düzenleme{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
    .meta { color: #666; font-size: .9rem; }
    .label { color: #666; font-size: .85rem; margin-bottom: 0; }
    .old { color: #888; } .new { font-weight: 600; }
    .warn { color: #b45309; font-size: .9rem; }
    .err { color: #b91c1c; } .ok { color: #15803d; }
    .empty { color: #666; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem; }
    button { font: inherit; padding: .4rem .8rem; margin: .25rem .25rem 0 0; cursor: pointer; }
  </style>
</head>
<body>
  <h1>SEO düzenleme</h1>
  {% block content %}{% endblock %}
</body>
</html>
